name: Windows installer
on:
  push:
    branches: [main]
    paths: ['src/**', 'package*.json', 'scripts/**', 'test/**', 'installer/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Install from resolved lock
        run: npm ci --no-audit --no-fund
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Build NSIS installer
        # The isolated UI test uses a synthetic preload, never an account.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Verify four-language bento interface
        env:
          STEAM_HOURS_SCREENSHOT_DIR: ${{ runner.temp }}/steam-hours-ui
        run: node_modules/.bin/electron.cmd scripts/runtime-smoke.cjs
      - name: Save UI screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: steam-hours-ui
          path: ${{ runner.temp }}/steam-hours-ui/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Verify public Steam game search
        run: node scripts/catalog-smoke.cjs
      - name: Build single application entry point
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $compilerArguments = @('/nologo', '/target:winexe', '/platform:x64', '/reference:System.Windows.Forms.dll', '/win32manifest:installer\app.manifest', '/win32icon:installer\app.ico', "/resource:dist\SteamHours-$version-Setup.exe,setup", '/out:dist\SteamHours.exe', 'installer\Bootstrap.cs')
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" @compilerArguments
          if ($LASTEXITCODE -ne 0) { throw 'Application launcher compilation failed.' }
      - name: Publish tested build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = '${{ github.repository }}'
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This version is already published. Increase package.json version.' }
          $assets = @((Resolve-Path dist/SteamHours.exe).Path, (Resolve-Path "dist/SteamHours-$version-Setup.exe").Path, (Resolve-Path "dist/SteamHours-$version-Setup.exe.blockmap").Path, (Resolve-Path dist/latest.yml).Path)
          $hash = (Get-FileHash "dist/SteamHours-$version-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          $entryHash = (Get-FileHash dist/SteamHours.exe -Algorithm SHA256).Hash.ToLower()
          @("$hash  SteamHours-$version-Setup.exe", "$entryHash  SteamHours.exe") | Set-Content dist/SHA256SUMS.txt -Encoding utf8
          $assets += (Resolve-Path dist/SHA256SUMS.txt).Path
          $assets += (Resolve-Path package-lock.json).Path
          gh release create $tag @assets --repo $repo --target '${{ github.sha }}' --title "Steam Hours $version" --notes 'Download and open SteamHours.exe. A local Steam session manager with a bento dashboard, game search and favorites. Select English, Turkish, Russian or Chinese using the flags at the top right. First launch prepares the application in the background. Windows x64. Unsigned application.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
