name: Windows installer
on:
  push:
    branches: [main]
    paths: ['src/**', 'package*.json', 'scripts/**', 'test/**', 'installer/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Install from resolved lock
        run: npm ci --no-audit --no-fund
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Verify public Steam game search
        run: node scripts/catalog-smoke.cjs
      - name: Build single application entry point
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /target:winexe /platform:x64 /reference:System.Windows.Forms.dll /win32manifest:installer/app.manifest /win32icon:installer/app.ico "/resource:dist/SteamSaat-$version-Setup.exe,setup" /out:dist/SteamSaat.exe installer/Bootstrap.cs
          if ($LASTEXITCODE -ne 0) { throw 'Application launcher compilation failed.' }
      - name: Publish tested build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = '${{ github.repository }}'
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This version is already published. Increase package.json version.' }
          $assets = @((Resolve-Path dist/SteamSaat.exe).Path, (Resolve-Path "dist/SteamSaat-$version-Setup.exe").Path, (Resolve-Path "dist/SteamSaat-$version-Setup.exe.blockmap").Path, (Resolve-Path dist/latest.yml).Path)
          $hash = (Get-FileHash "dist/SteamSaat-$version-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          $entryHash = (Get-FileHash dist/SteamSaat.exe -Algorithm SHA256).Hash.ToLower()
          @("$hash  SteamSaat-$version-Setup.exe", "$entryHash  SteamSaat.exe") | Set-Content dist/SHA256SUMS.txt -Encoding utf8
          $assets += (Resolve-Path dist/SHA256SUMS.txt).Path
          $assets += (Resolve-Path package-lock.json).Path
          gh release create $tag @assets --repo $repo --target '${{ github.sha }}' --title "Steam Saat $version" --notes 'SteamSaat.exe dosyasını aç. İlk açılışta arka planda hazırlanır ve uygulama açılır; terminal veya kurulum sihirbazı yoktur. Windows x64. Steam araması ve kalıcı favoriler. Yayıncı sertifikası yoktur.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
